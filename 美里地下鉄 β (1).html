<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美里地下鉄 β</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F2; --panel:#F8F9FA; --card:#FFFFFF; --ink:#1D2833; --sub:#5B6B79; --rule:#D3D9DE;
  --zone:#7C8D9C; --water:#DCE5EC; --brand:#0E6E5C; --brand-ink:#FFFFFF;
  --ok:#2A7D3A; --warn:#B26B00; --warn-bg:#FFF1D6; --stop:#C1272D; --stop-bg:#FBE3E3; --halt:#5A0E12;
  --st-fill:#FFFFFF; --shadow:0 6px 24px rgba(20,30,40,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A20; --panel:#1A2128; --card:#212A32; --ink:#E3E8EC; --sub:#93A2AF; --rule:#2E3943;
    --zone:#6E8091; --water:#10161C; --brand:#3FB59A; --brand-ink:#0B1A16;
    --ok:#5CC071; --warn:#E6A63A; --warn-bg:#3A2C10; --stop:#F06464; --stop-bg:#3A1717; --halt:#FFB4B4;
    --st-fill:#1A2128; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A20; --panel:#1A2128; --card:#212A32; --ink:#E3E8EC; --sub:#93A2AF; --rule:#2E3943;
  --zone:#6E8091; --water:#10161C; --brand:#3FB59A; --brand-ink:#0B1A16;
  --ok:#5CC071; --warn:#E6A63A; --warn-bg:#3A2C10; --stop:#F06464; --stop-bg:#3A1717; --halt:#FFB4B4;
  --st-fill:#1A2128; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:14px;line-height:1.55;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #0079C2;outline-offset:2px}
.shell{display:grid;grid-template-rows:auto 1fr;height:100%}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--brand);color:var(--brand-ink)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.04em;white-space:nowrap}
.logo .mk{width:30px;height:30px;border-radius:8px;border:3px solid currentColor;display:grid;place-items:center;font-size:15px}
.logo small{font-size:10.5px;font-weight:700;border:1.5px solid currentColor;border-radius:4px;padding:0 4px;opacity:.85}
.clock{margin-left:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:10px;padding:5px 12px}
.clock b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock span{font-size:11.5px;line-height:1.3;text-align:left}
.clock .sim{font-size:10.5px;font-weight:700;background:#FFE36E;color:#3A2C00;border-radius:4px;padding:0 4px}
.main{display:grid;grid-template-columns:420px 1fr;min-height:0}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--rule)}
nav.tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--panel)}
nav.tabs button{flex:1;border:0;background:none;padding:11px 4px 9px;font-weight:700;font-size:13.5px;color:var(--sub);border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
nav.tabs .maptab{display:none}
.view{flex:1;overflow-y:auto;padding:16px;display:none;min-height:0}
.view.on{display:block}
.mapwrap{position:relative;overflow:hidden;background:var(--water);touch-action:none;min-height:0}
svg#map{width:100%;height:100%;display:block;cursor:grab}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:50;font-weight:700;color:var(--sub)}
.loading.hide{display:none}
h2.vh{font-size:16px;margin:0 0 12px}
.field{position:relative;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:0 10px;margin-bottom:8px}
.field label{font-size:11.5px;font-weight:700;color:var(--sub);width:2.6em;flex:none}
.field input{flex:1;border:0;background:none;padding:11px 0;font-size:15px;min-width:0}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.swap{position:absolute;right:-6px;top:30px;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--card);display:grid;place-items:center;z-index:2;box-shadow:var(--shadow)}
.odwrap{position:relative;padding-right:30px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
input[type=time],input[type=date]{border:1px solid var(--rule);border-radius:9px;background:var(--card);padding:6px 8px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:15px}
.btn.wide{width:100%;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule);font-size:13px;padding:7px 11px;font-weight:400}
.dd{list-style:none;margin:0;padding:0;position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);max-height:300px;overflow-y:auto}
.dd:empty{display:none}
.dd li{padding:8px 12px;border-top:1px solid var(--rule);cursor:pointer}
.dd li:first-child{border-top:0}
.dd li[aria-selected="true"],.dd li:hover{background:var(--paper)}
.dd .nm{font-weight:700}.dd .yo{font-size:11.5px;color:var(--sub);margin-left:6px}
.chips{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle}
.chip{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 4px;border:2.5px solid var(--c);border-radius:5px;font-weight:700;font-size:11px;background:var(--st-fill);color:var(--ink);line-height:1}
.chip.lg{min-width:34px;height:26px;font-size:13px;border-width:3.5px;border-radius:7px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.res{cursor:pointer}
.res.sel{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 30%,transparent)}
.res .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.res .tm{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.res .meta{color:var(--sub);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;color:#fff}
.tag.fast{background:#0079C2}.tag.easy{background:#2A9D3A}
.legs{margin-top:10px;border-top:1px dashed var(--rule);padding-top:8px;display:none}
.res.sel .legs{display:block}
.leg{display:grid;grid-template-columns:52px 14px 1fr;gap:0 8px;font-size:13px}
.leg .t{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.leg .bar{width:6px;border-radius:3px;justify-self:center;background:var(--c)}
.leg .stn{font-weight:700}
.leg .ride{color:var(--sub);font-size:12px;padding:4px 0 6px}
.leg .xfer{grid-column:1/-1;color:var(--sub);font-size:12px;padding:3px 0 3px 74px}
.warn{display:inline-block;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 5px;margin-left:4px}
.warn.stop{color:var(--stop);background:var(--stop-bg)}
.fare{display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin-top:4px}
.fare b{color:var(--ink);font-size:14px}
.empty{color:var(--sub);text-align:center;padding:20px 0}
.status-list .ln{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--rule)}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.badge.l0{color:var(--ok)}
.badge.l1{color:var(--warn);background:var(--warn-bg)}
.badge.l2{color:var(--stop);background:var(--stop-bg)}
.badge.l3{color:#fff;background:var(--halt)}
:root[data-theme="dark"] .badge.l3{color:#2a0505}
.incident{border-left:5px solid var(--warn)}
.incident.l2,.incident.l3{border-left-color:var(--stop)}
.incident p{margin:6px 0 0}
.incident .when{font-size:11.5px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.6}
.tt-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.tt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tt th{width:42px;background:var(--paper);font-size:13px;border-bottom:1px solid var(--rule);padding:4px 0}
.tt td{border-bottom:1px solid var(--rule);padding:4px 6px;font-size:13.5px;line-height:1.9}
.tt tr.now th{background:var(--brand);color:var(--brand-ink)}
.tt tr.past td{color:var(--sub)}
.tt .m{display:inline-block;min-width:2.1em;text-align:center;margin-right:2px;position:relative}
.tt .m.x{color:var(--stop);font-weight:700}
.tt .m sup{font-size:9px;color:var(--sub);position:absolute;top:-7px;left:50%;transform:translateX(-50%);white-space:nowrap}
.legend-k{font-size:11.5px;color:var(--sub)}
.tt .m{cursor:pointer;border-radius:4px}
.tt .m:hover,.tt .m:focus-visible{background:var(--paper);text-decoration:underline}
.dp a,.tlink{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;cursor:pointer}
.trip-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trip-hd b{font-size:16px}
.stops{list-style:none;margin:12px 0 0;padding:0;position:relative}
.stops li{display:grid;grid-template-columns:58px 18px 1fr;align-items:center;min-height:34px;font-variant-numeric:tabular-nums}
.stops .tm{text-align:right;font-weight:700;font-size:14px;line-height:1.2}
.stops .tm small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.stops .rail{position:relative;height:100%;justify-self:center;width:18px}
.stops .rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:6px;background:var(--c)}
.stops li:first-child .rail::before{top:50%}
.stops li:last-child .rail::before{bottom:50%}
.stops .rail::after{content:"";position:absolute;left:2px;top:50%;width:10px;height:10px;margin-top:-7px;border-radius:50%;background:var(--st-fill);border:2px solid var(--ink)}
.stops li.pass .rail::after{display:none}
.stops li.pass{min-height:24px;color:var(--sub);font-size:12px}
.stops li.pass .tm{font-weight:400;font-size:12px;color:var(--sub)}
.stops .nm{padding-left:8px;cursor:pointer}
.stops li.cur{background:color-mix(in srgb,var(--brand) 12%,transparent);border-radius:8px}
.stops li.cur .nm{font-weight:700}
.stops li.past{opacity:.5}
.stops .nm .chips{margin-left:6px}
.nexts{display:grid;gap:6px;margin-top:8px}
.nexts .g{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;padding:8px 10px;background:var(--paper);border-radius:8px}
.nexts .g .lbl{font-weight:700;font-size:13px}
.nexts .g .dp{font-variant-numeric:tabular-nums;font-size:13px;grid-column:1/-1}
.st-card .nm{font-size:22px;font-weight:700;line-height:1.2}
.st-card .yo{color:var(--sub);font-size:12.5px}
.ctl{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.ctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);font-size:18px}
.mapinfo{position:absolute;left:12px;top:12px;max-width:min(320px,calc(100% - 24px));background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);font-size:12.5px;display:none}
.mapinfo.on{display:block}
.mapinfo .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:18px}
.maplegend{position:absolute;right:12px;top:12px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--sub)}
.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.dim .line:not(.hl){opacity:.15}
.dim .st{opacity:.35}
.st circle{fill:var(--st-fill)}
.lbl{fill:var(--ink);paint-order:stroke;stroke:var(--paper);pointer-events:none}
.train{stroke:var(--st-fill)}
.train.late{stroke:#FFB000}
.train.halt{stroke:#E01B24}
.zone{fill:none;stroke:var(--zone);stroke-dasharray:6 5}
dialog{border:1px solid var(--rule);border-radius:14px;background:var(--panel);color:var(--ink);padding:18px;max-width:min(420px,calc(100% - 24px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,15,20,.45)}
dialog h3{margin:0 0 12px;font-size:16px}
dialog .row{margin-bottom:12px}
@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .panel{border-right:0}
  nav.tabs{order:2;border-bottom:0;border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs .maptab{display:flex}
  .mapwrap{display:none}
  body.mapmode .mapwrap{display:block;position:fixed;left:0;right:0;top:var(--hh,52px);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:5}
  :root{padding-bottom:0}
  .clock span{display:none}
  .logo small{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.clk{cursor:pointer;border-radius:4px}
.clk:hover{background:var(--paper)}
.tt .m{cursor:pointer;border-radius:4px}
.tt .m:hover{background:var(--paper);outline:1px solid var(--rule)}
.linepick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.linepick button{border:0;background:none;padding:0}
.linepick .chip{cursor:pointer}
.linepick button[aria-pressed="true"] .chip{background:var(--c);color:#fff}
.ldia{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:6px 0;margin-top:8px}
.lr{display:grid;grid-template-columns:1fr 22px minmax(90px,1.1fr) 22px 1fr;align-items:center}
.lr .l{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;padding:2px 4px}
.lr .r{display:flex;flex-wrap:wrap;gap:3px;padding:2px 4px}
.lr .rail{position:relative;align-self:stretch;min-height:30px}
.lr .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:var(--c)}
.lr.st .rail i{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:var(--st-fill);border:2.5px solid var(--c)}
.lr.gap{min-height:18px}
.lr.gap .rail{min-height:18px}
.lr .snm{text-align:center;font-size:13px;font-weight:700;line-height:1.25;padding:3px 2px}
.lr .snm small{display:block;font-weight:400;font-size:10.5px;color:var(--sub)}
.trn{display:inline-flex;align-items:center;gap:2px;border:0;border-radius:5px;padding:1px 5px;font-size:11px;font-weight:700;background:var(--c);color:#fff;line-height:1.4}
.trn.x{box-shadow:inset 0 0 0 2px #fff,0 0 0 1.5px var(--c)}
.trn.late{background:var(--warn)}
.trn.halt{background:var(--stop)}
.ldir{display:grid;grid-template-columns:1fr 22px minmax(90px,1.1fr) 22px 1fr;font-size:11.5px;color:var(--sub);font-weight:700;margin-top:6px}
.ldir span:first-child{text-align:right}
.status-list .ln{cursor:pointer}
.status-list .ln:hover{background:var(--card)}
@media (max-width:860px){ nav.tabs button{font-size:11.5px} }

.certbtn{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0 0 12px;text-align:left}
.cert{position:relative;background:#FFFEFA;color:#1D2833;border:1px solid #C9CFD4;border-radius:4px;padding:22px 20px 18px;box-shadow:var(--shadow);margin-top:12px}
.cert::before{content:"";position:absolute;inset:6px;border:2px solid #0E6E5C;border-radius:2px;pointer-events:none}
.cert .fict{text-align:center;font-size:11.5px;font-weight:700;color:#B1121A;border:1.5px dashed #B1121A;border-radius:4px;padding:3px 6px;margin:0 0 10px}
.cert h3{text-align:center;font-size:22px;letter-spacing:.5em;margin:4px 0 2px;padding-left:.5em}
.cert .iss{text-align:center;font-size:12px;color:#5B6B79;margin-bottom:14px}
.cert dl{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;margin:0 0 12px;font-size:13.5px}
.cert dt{color:#5B6B79}
.cert dd{margin:0;font-weight:700}
.cert table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:10px}
.cert th,.cert td{border:1px solid #C9CFD4;padding:6px 8px;text-align:left}
.cert th{background:#EEF2F1;font-weight:700;width:40%}
.cert td.bad{color:#B1121A;font-weight:700}
.cert .inc{font-size:12.5px;margin:0 0 4px;padding-left:1em;text-indent:-1em}
.cert .stamp{position:absolute;right:22px;bottom:16px;width:64px;height:64px;border:2.5px solid #C1272D;border-radius:50%;color:#C1272D;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:700;line-height:1.25;transform:rotate(-12deg);opacity:.85}
.cert .fine{font-size:11px;color:#5B6B79;margin:10px 84px 0 0;line-height:1.6}
.daysum{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.daysum button{border:0;background:none;padding:0;position:relative}
.daysum button[aria-pressed="true"] .chip{background:var(--c);color:#fff}
.daysum .chip{cursor:pointer}
.daysum .dl{position:absolute;right:-5px;top:-6px;background:var(--stop);color:#fff;border-radius:8px;font-size:9.5px;font-weight:700;padding:0 3px;line-height:1.4}
@media print{
  body{overflow:visible;background:#fff}
  .shell>header,nav.tabs,.mapwrap,.loading,#v-delay>*:not(#certWrap),#certWrap>*:not(.cert){display:none!important}
  .main{display:block}.panel{border:0;background:#fff}.view{display:none!important}#v-delay{display:block!important;overflow:visible;padding:0}
  .cert{box-shadow:none;max-width:560px;margin:0 auto}
}

.ctl-sec{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.ctl-sec h3{font-size:14px;margin:0 0 10px}
.ctl-sec label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:8px 0 3px}
.ctl-sec select{width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:8px;font-size:14px}
.evrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:13px}
.evrow:first-of-type{border-top:0}
.evrow .tm{font-variant-numeric:tabular-nums;font-weight:700}
.evrow.fut{opacity:.6}
.evrow.cx{text-decoration:line-through;opacity:.55}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:4px;border:1px solid currentColor}
.dbst{font-size:12px;border-radius:8px;padding:6px 10px;margin-bottom:12px;background:var(--paper)}
</style>
</head>
<body>
<div class="loading" id="loading">ダイヤを作成しています…</div>
<div class="shell">
  <header class="top" id="top">
    <div class="logo"><span class="mk">美</span>美里地下鉄<small>β版</small></div>
    <button class="clock" id="clockBtn" aria-label="表示する日時を変更"><span id="clockDay"></span><b id="clockTime">--:--</b></button>
  </header>
  <div class="main">

<script>/* 美里地下鉄 core engine (pure logic, no DOM) */
(function (G) {
  "use strict";
  const D = G.MS_DATA, ST = D.st, LN = D.lines;
  const NS = ST.length;
  const HUB = ST.findIndex(s => s.h);
  const dist = (a, b) => Math.hypot(ST[a].x - ST[b].x, ST[a].y - ST[b].y);

  /* ---------- time helpers ---------- */
  const WD_B = [[0, 390, 0], [390, 570, 1], [570, 990, 2], [990, 1200, 3], [1200, 9999, 4]];
  const HD_B = [[0, 480, 0], [480, 1200, 2], [1200, 9999, 4]];
  function band(min, hol) { for (const [a, b, k] of hol ? HD_B : WD_B) if (min >= a && min < b) return k; return 4; }
  const isRush = (min, hol) => { if (hol) return false; const k = band(min, false); return k === 1 || k === 3; };
  const fmt = s => { if (!isFinite(s)) return "--:--"; s = Math.round(s / 60); const h = Math.floor(s / 60), m = s % 60; return h + ":" + String(m).padStart(2, "0"); };
  const fmtClock = s => { s = Math.round(s / 60); const h = Math.floor(s / 60) % 24, m = s % 60; return h + ":" + String(m).padStart(2, "0"); };

  /* ---------- geometry per line ---------- */
  LN.forEach((L, li) => {
    const n = L.st.length;
    L.n = n;
    L.seg = []; // km between idx i and i+1 (closed: n segments)
    for (let i = 0; i < (L.closed ? n : n - 1); i++) L.seg.push(dist(L.st[i], L.st[(i + 1) % n]));
    L.len = L.seg.reduce((a, b) => a + b, 0);
    L.tbSet = new Map(L.tb.map(([i, d]) => [i, d]));
    L.li = li;
  });
  const lineName = li => LN[li].name;

  /* ---------- run time model ---------- */
  const ACC = 3.0 / 3.6, DEC = 3.5 / 3.6;
  function runTime(dkm, vmax) {
    const d = dkm * 1000, v = vmax / 3.6, da = v * v / (2 * ACC), dd = v * v / (2 * DEC);
    let t;
    if (d >= da + dd) t = d / v + v / (2 * ACC) + v / (2 * DEC);
    else { const vp = Math.sqrt(2 * d * ACC * DEC / (ACC + DEC)); t = vp / ACC + vp / DEC; }
    return Math.round(t * 1.05 + 5);
  }
  function dwell(sid, tSec, hol) {
    if (isRush(tSec / 60, hol)) { if (sid === HUB) return 60; if (ST[sid].l.length > 1) return 45; }
    return 30;
  }
  const gcd = (a, b) => b ? gcd(b, a % b) : a;

  /* service = {li, kind, stops: [line idx], gapKm: [], gapV: [], sections} */
  function services(li) {
    const L = LN[li], out = [];
    const mk = (kind, idxs, secs) => {
      const n = L.n, gaps = [], vmax = [], segsOf = [];
      const m = idxs.length;
      for (let j = 0; j < (L.closed ? m : m - 1); j++) {
        const a = idxs[j], b = idxs[(j + 1) % m];
        let km = 0, segs = [], i = a;
        do { km += L.seg[i]; segs.push(i); i = (i + 1) % n; } while (i !== b);
        gaps.push(km); segsOf.push(segs);
        const s = secs.find(s => a >= s.a && a < s.b) || secs[secs.length - 1];
        vmax.push(s.v);
      }
      out.push({ li, kind, idxs, gaps, vmax, segsOf, secs });
    };
    mk("local", [...Array(L.n).keys()], L.sec);
    if (L.xsec) mk("express", L.xst, L.xsec);
    return out;
  }

  /* ---------- timetable generation ---------- */
  const TT = {}; // cache by hol
  function buildTimetable(hol) {
    if (TT[hol]) return TT[hol];
    const trips = [];
    LN.forEach((L, li) => services(li).forEach(sv => genService(sv, hol, trips)));
    // group into RAPTOR routes

    trips.forEach(t => {
      const key = t.li + "|" + t.kind + "|" + t.dir + "|" + t.stops.join(",");
      let r = rmap.get(key);
      if (!r) { r = { id: routes.length, li: t.li, kind: t.kind, dir: t.dir, stops: t.stops, idx: t.idx, segs: t.segs, trips: [] }; rmap.set(key, r); routes.push(r); }
      t.route = r.id; r.trips.push(t);
    });
    routes.forEach(r => { r.trips.sort((a, b) => a.dep[0] - b.dep[0]); r.trips.forEach((t, k) => t.k = k); });
    const stopRoutes = Array.from({ length: NS }, () => []);
    routes.forEach(r => r.stops.forEach((s, p) => { if (p < r.stops.length - 1) stopRoutes[s].push([r.id, p]); }));
    TT[hol] = { trips, routes, stopRoutes };
    return TT[hol];
  }

  function genService(sv, hol, out) {
    const L = LN[sv.li], m = sv.idxs.length, secs = sv.secs;
    let g = 0; secs.forEach(s => s.h.forEach(h => g = gcd(g, h)));
    // build a virtual full trip from a reference departure tau, direction dir

          t += runTime(sv.gaps[gi], sv.vmax[gi]);
        }
        arr[j] = t;
        const sid = L.st[sv.idxs[j]];
        dep[j] = t + (q === 0 ? 0 : dwell(sid, t, hol));
        t = dep[j];
      });
      return { arr, dep, order };
    };
    if (L.closed) {
      /* Ring lines run as continuously circulating trains. Each physical train is one trip, so a passenger
         can stay aboard across any station. Headways are regulated at the depot: a train arriving there is
         held for the next departure slot; surplus trains are withdrawn, missing ones dispatched from it.
         Before the first-train time trains start at the turnback station their slot reaches first;
         after the last-train time each train ends at the next turnback station. */
      const s = secs[0], F = s.f * 60, Lt = s.l * 60;
      const depIdx = (L.tb.find(([ix, dpt]) => dpt === 1 && sv.idxs.includes(ix)) || L.tb.find(([ix]) => sv.idxs.includes(ix)) || [sv.idxs[0]])[0];
      const aj = sv.idxs.indexOf(depIdx);
      const isTb = j => L.tbSet.has(sv.idxs[j]);
      const MAXWAIT = 15 * 60;
      for (let dir = 0; dir < 2; dir++) {
        const seq = []; for (let q = 0; q < m; q++) seq.push(dir === 0 ? (aj + q) % m : ((aj - q) % m + m) % m);
        const gapIdx = q => { const a = seq[q], b = seq[(q + 1) % m]; return dir === 0 ? a : b; };
        // one loop from the depot departing at t; returns arrays for positions 1..m (m = back at depot)
        const loop = (t, fromQ) => {
          const r = { j: [], arr: [], dep: [], segs: [] };
          for (let q = fromQ; q < m; q++) {

  /* ---------- fares ---------- */

  /* ---------- deterministic RNG ---------- */

  /* ---------- events ---------- */

  };

  const SPECIAL = {
    EV001: { type: "rush" },
    EV004: { boost: { months: [7, 8, 9], from: 960, to: 1140, lv: 8 } },
    EV005: { boost: { months: [1, 4, 12], from: 1200, to: 1620, lv: 10 } },
    EV021: { type: "prefirst" }
  };
  function evEnabled(e) {
    if (e.mode !== "自動発生") return false;
    return [e.c1, e.c2].every(c => !c || SUPPORTED_COND.has(c));
  }
  const suburbKm = LN.map(L => L.seg.reduce((a, km, i) => { const p = ST[L.st[i]], q = ST[L.st[(i + 1) % L.n]]; return a + ((Math.hypot(p.x, p.y) + Math.hypot(q.x, q.y)) / 2 >= 50 ? km : 0); }, 0));
  const todWeight = (tod, min, hol) => {

  const EVC = {};

    const cand = [];
    D.ev.forEach((e, ei) => {

      }

      }

      };

  }

  function makeOcc(e, c, dateKey, hol) {
    const r = rng(hash(dateKey + "|occ|" + e.id + "|" + c.li + "|" + c.min + (c.mid ? "|" + c.mid : "")));

    let stIdx = null, sid = null;
    if (c.li >= 0) {

    $("#clockDay").innerHTML = `${N.d.getMonth() + 1}/${N.d.getDate()}(${WD[N.d.getDay()]})<br>${N.hol ? "土休日" : "平日"}ダイヤ${clk.mode === "sim" || clk.speed > 1 ? ' <span class="sim">' + (clk.speed > 1 ? clk.speed + "倍速" : "指定") + "</span>" : ""}`;
    const key = N.key + "|" + N.hol;
    if (key !== lastKey) { lastKey = key; if (!ttReady[N.hol]) { $("#loading").classList.remove("hide"); ensureTT(N.hol, () => { $("#loading").classList.add("hide"); tick(true); }); return; } }
    const m = Math.floor(N.sec / 60);
    if (m !== lastMin || force) {
      lastMin = m;
      state = MS.stateAt(N.key, N.month, N.hol, N.sec);
      if (curView === "status") renderStatus(); else renderStatusBadge();
      if (curView === "station") renderStation();
      if (curView === "trip") { const sc = TPV.scrollTop; renderTrip(); TPV.scrollTop = sc; }
      if (curView === "line") renderLine(false);
      if (curView === "delay" && certDate === N.key) renderCert();
      if (curView === "ctl" && !document.querySelector("#v-ctl select:focus")) renderCtl();
    }
    updateTrains();
    if (curView === "line" && (++lineTick % 3 === 0)) renderLine(false);
  }
  let lineTick = 0;
  function renderStatusBadge() { if (!state) return; const n = LN.filter((L, li) => state.lineStatus(li, N.sec).level > 0).length; $("#statusTab").lastChild.textContent = n ? `運行情報(${n})` : "運行情報"; }

  // boot
  const saved = store.get("od", null); if (saved) { if (saved.from != null) setOD("from", saved.from); if (saved.to != null) setOD("to", saved.to); }
  setTimeNow();
  renderTT();
  ensureTT(N.hol, () => { $("#loading").classList.add("hide"); lastKey = N.key + "|" + N.hol; fit(); mapFitted = window.innerWidth > 860; tick(true); });
  setInterval(() => tick(false), 1000);
  // hide "地図で見る" buttons on desktop where the map is always visible
  const mq = window.matchMedia("(max-width:860px)");
  const st = document.createElement("style"); document.head.appendChild(st);
  const upd = () => st.textContent = mq.matches ? "" : ".maponly{display:none}";
  upd(); mq.addEventListener ? mq.addEventListener("change", upd) : mq.addListener(upd);
})();
</script>
</body>
</html>
